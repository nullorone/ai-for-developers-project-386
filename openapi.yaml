  /owner/availability:
    get:
      tags: [Owner availability]
      operationId: listOwnerAvailability
      summary: Список интервалов доступности
      description: |
        Возвращает все опубликованные интервалы доступности единственного календаря
        в UTC, отсортированные по `startsAt` по возрастанию (US-O2 AC1).

        Пагинация не применяется: количество интервалов ограничено правилом A-8
        (максимум 500 на календарь).
      responses:
        '200':
          description: Список интервалов (возможно пустой).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityWindowList'
              examples:
                twoWindows:
                  summary: Два интервала
                  value:
                    calendarId: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    total: 2
                    maxWindows: 500
                    items:
                      - id: c0a1b2c3-d4e5-4f60-8a1b-2c3d4e5f6071
                        startsAt: '2026-09-01T09:00:00Z'
                        endsAt: '2026-09-01T13:00:00Z'
                        createdAt: '2026-08-25T08:00:00Z'
                      - id: d1b2c3d4-e5f6-4071-8b2c-3d4e5f607182
                        startsAt: '2026-09-02T12:00:00Z'
                        endsAt: '2026-09-02T16:30:00Z'
                        createdAt: '2026-08-25T08:01:12Z'
                empty:
                  summary: Доступность не опубликована
                  value:
                    calendarId: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    total: 0
                    maxWindows: 500
                    items: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Owner availability]
      operationId: createOwnerAvailabilityWindow
      summary: Опубликовать интервал доступности
      description: |
        Создает интервал доступности единственного календаря.

        Требования (правила A-3 — A-8):

        * `startsAt` и `endsAt` кратны 30 минутам в UTC, секунды нулевые;
        * `endsAt` строго позже `startsAt`, минимальная длина — 30 минут;
        * `endsAt > now`: интервал целиком в прошлом создать нельзя;
        * длина интервала не больше 14 дней;
        * в календаре не больше 500 интервалов;
        * интервал не пересекается с существующими; смежные интервалы
          (`endsAt` одного равен `startsAt` другого) разрешены.

        Пересечение возвращает `409 AVAILABILITY_OVERLAP`, включая случай
        конкурентного создания (US-O1 AC7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAvailabilityWindowRequest'
            examples:
              morning:
                summary: Утро рабочего дня
                value:
                  startsAt: '2026-09-03T09:00:00Z'
                  endsAt: '2026-09-03T13:00:00Z'
      responses:
        '201':
          description: Интервал создан.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: Путь созданного интервала.
              required: true
              schema:
                type: string
                examples:
                  - /api/v1/owner/availability/c0a1b2c3-d4e5-4f60-8a1b-2c3d4e5f6071
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityWindow'
              examples:
                created:
                  summary: Созданный интервал
                  value:
                    id: c0a1b2c3-d4e5-4f60-8a1b-2c3d4e5f6071
                    startsAt: '2026-09-03T09:00:00Z'
                    endsAt: '2026-09-03T13:00:00Z'
                    createdAt: '2026-08-30T18:20:05Z'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '409':
          description: Интервал пересекается с уже существующим (правило A-5).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                overlap:
                  summary: Пересечение интервалов
                  value:
                    code: AVAILABILITY_OVERLAP
                    message: Availability window overlaps an existing one.
                    details:
                      - location: body
                        field: startsAt
                        rule: A-5
                        message: Overlapping window 2026-09-03T08:00:00Z–2026-09-03T12:00:00Z already exists.
                    requestId: 6b7c8d9e-0f1a-4b2c-8d3e-4f5a6b7c8d9e
                    timestamp: '2026-08-30T18:20:05Z'
        '422':
          description: |
            Границы интервала нарушают правила A-3, A-4, A-6, A-7 или превышен
            лимит количества интервалов A-8.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notAligned:
                  summary: Границы не кратны 30 минутам
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is invalid.
                    details:
                      - location: body
                        field: startsAt
                        rule: A-3
                        message: Minutes must be 00 or 30 and seconds must be zero.
                    requestId: 8d9e0f1a-2b3c-4d5e-8f6a-7b8c9d0e1f2a
                    timestamp: '2026-08-30T18:20:05Z'
                limitReached:
                  summary: Достигнут лимит интервалов
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is invalid.
                    details:
                      - location: body
                        field: startsAt
                        rule: A-8
                        message: Calendar already contains the maximum of 500 availability windows.
                    requestId: 9e0f1a2b-3c4d-4e5f-8a6b-7c8d9e0f1a2b
                    timestamp: '2026-08-30T18:20:05Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /owner/availability/{windowId}:
    parameters:
      - $ref: '#/components/parameters/AvailabilityWindowId'
    delete:
      tags: [Owner availability]
      operationId: deleteOwnerAvailabilityWindow
      summary: Удалить интервал доступности
      description: |
        Удаляет интервал доступности. Тело ответа не нужно, поэтому возвращается `204`.

        Удаление запрещено, если интервал пересекается хотя бы с одним подтвержденным
        бронированием, начало которого в будущем: возвращается
        `409 AVAILABILITY_WINDOW_HAS_BOOKINGS`, ничего не удаляется (правило A-9).
        Прошедшие и отмененные бронирования удалению не мешают (US-O2 AC5).

        Несуществующий или уже удаленный интервал дает `404` без иных побочных
        эффектов (US-O2 AC4).
      responses:
        '204':
          description: Интервал удален.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '404':
          description: Интервал доступности не найден.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Интервал не найден
                  value:
                    code: AVAILABILITY_WINDOW_NOT_FOUND
                    message: Availability window not found.
                    requestId: 0f1a2b3c-4d5e-4f6a-8b7c-8d9e0f1a2b3c
                    timestamp: '2026-08-30T18:25:40Z'
        '409':
          description: Интервал пересекается с будущими подтвержденными встречами (правило A-9).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                hasBookings:
                  summary: В интервале есть будущие встречи
                  value:
                    code: AVAILABILITY_WINDOW_HAS_BOOKINGS
                    message: Availability window still contains confirmed future bookings.
                    details:
                      - location: path
                        field: windowId
                        rule: A-9
                        message: Reschedule 2 confirmed bookings before deleting this window.
                    requestId: 1a2b3c4d-5e6f-4a7b-8c8d-9e0f1a2b3c4d
                    timestamp: '2026-08-30T18:25:40Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /owner/bookings:
    get:
      tags: [Owner bookings]
      operationId: listOwnerBookings
      summary: Список будущих подтвержденных встреч
      description: |
        Возвращает встречи со статусом `CONFIRMED`, начало которых строго позже
        текущего момента, отсортированные по `startsAt` по возрастанию (US-O3).

        Отмененные и прошедшие встречи в список не попадают. Комментарий гостя
        не возвращается, email маскируется (правило R-10). Пагинации нет: список
        ограничен горизонтом бронирования 90 дней и объемом доступности.
      responses:
        '200':
          description: Список будущих подтвержденных встреч (возможно пустой).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerBookingList'
              examples:
                twoBookings:
                  summary: Две будущие встречи
                  value:
                    calendarId: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    total: 2
                    generatedAt: '2026-08-30T18:30:00Z'
