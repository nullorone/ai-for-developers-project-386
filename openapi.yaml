openapi: 3.1.0

info:
  title: Booking Call API
  version: 1.0.0
  summary: REST API сервиса «Запись на звонок» (MVP)
  description: |
    Контракт сервиса «Запись на звонок»: владелец публикует интервалы доступности,
    гость бронирует свободный 30-минутный слот, отменяет его по защищенной ссылке,
    владелец переносит встречу на другой свободный слот.

    Этот документ — единственный источник истины для API (Design First, ADR 0002).
    Реализация backend и клиент frontend обязаны соответствовать ему; контракт не
    выводится из декораторов NestJS.

    ## Инварианты контракта

    * Все моменты времени — RFC 3339 в UTC с суффиксом `Z`, точность до секунд
      (правило T-1). Смещения, отличные от `Z`, отклоняются как ошибка валидации.
    * Границы слотов, бронирований и доступности имеют минуты `00` или `30`
      и нулевые секунды (правила A-3, T-3).
    * Интервалы времени — полуинтервалы `[startsAt, endsAt)` (правило T-4).
    * Длительность слота фиксирована: 30 минут (правило A-2). Клиент передает
      только момент начала; конец вычисляет сервер (правила B-2, R-2).
    * В системе один seed-календарь и один владелец (правило A-1). Аутентификации
      нет, owner-эндпоинты публичны — осознанное учебное ограничение (ADR 0001).
    * Единственный секрет продукта — management token гостя. Он передается только
      в заголовке `X-Booking-Token` и никогда не появляется в path или query
      (правило M-6).
    * Все ошибки имеют единый формат [`Error`](#/components/schemas/Error)
      со стабильным машинным полем `code`.
    * Все DTO закрыты от неожиданных свойств (`additionalProperties: false`).
    * Пагинация не применяется: объемы ответов ограничены правилами S-5, S-8 и A-8.

    ## Ссылки

    * [Продуктовые требования](docs/product-requirements.md)
    * [ADR 0001. Scope MVP и базовая архитектура](docs/adr/0001-mvp-scope-and-architecture.md)
    * [ADR 0002. Решения API-контракта](docs/adr/0002-api-contract-decisions.md)
    * [Руководство по контракту, lint и mock](docs/api.md)
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Booking Call maintainers
    url: https://github.com/nullorone/ai-for-developers-project-386

servers:
  - url: http://localhost:3000/api/v1
    description: Локальный backend (Docker Compose или `npm run start:dev`)
  - url: http://127.0.0.1:4010
    description: |
      Локальный mock server (Prism). Prism отбрасывает базовый путь сервера и
      обслуживает операции от корня, поэтому здесь префикс `/api/v1` отсутствует.
      См. `docs/api.md`.

tags:
  - name: Calendar
    description: Публичный просмотр календаря и свободных слотов.
  - name: Bookings
    description: Создание бронирования гостем.
  - name: Cancellation
    description: Просмотр и отмена бронирования по management token.
  - name: Owner availability
    description: Управление интервалами доступности владельцем.
  - name: Owner bookings
    description: Список будущих встреч и перенос встречи владельцем.
  - name: System
    description: Служебные пробы работоспособности.

paths:
  /calendars/{slug}:
    parameters:
      - $ref: '#/components/parameters/CalendarSlug'
    get:
      tags: [Calendar]
      operationId: getCalendarBySlug
      summary: Получить публичный календарь
      description: |
        Возвращает публичное описание календаря: заголовок, описание, часовой пояс
        владельца в формате IANA, фиксированную длительность слота и продуктовые
        ограничения бронирования (лид-тайм, горизонт).

        Часовой пояс владельца информационный: он не влияет на расчет слотов
        (правило T-5). Если календаря с таким `slug` нет, возвращается `404`
        без раскрытия существования других календарей (US-G1 AC2).
      responses:
        '200':
          description: Календарь найден.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
              examples:
                demo:
                  summary: Демонстрационный календарь
                  value:
                    id: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    slug: demo
                    title: Консультация 30 минут
                    description: Короткий звонок для обсуждения задачи и следующих шагов.
                    ownerTimeZone: Europe/Amsterdam
                    slotDurationMinutes: 30
                    minimumLeadTimeMinutes: 60
                    bookingHorizonDays: 90
        '404':
          $ref: '#/components/responses/CalendarNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{slug}/slots:
    parameters:
      - $ref: '#/components/parameters/CalendarSlug'
      - $ref: '#/components/parameters/SlotsFrom'
      - $ref: '#/components/parameters/SlotsTo'
    get:
      tags: [Calendar]
      operationId: listCalendarSlots
      summary: Получить свободные слоты календаря
      description: |
        Возвращает свободные 30-минутные слоты календаря в запрошенном UTC-диапазоне.

        Правила отбора:

        * слот полностью лежит внутри опубликованного интервала доступности (S-1, S-2);
        * на начало слота нет активного (`CONFIRMED`) бронирования (S-2);
        * `slot.startsAt >= now + 60 минут` (минимальный лид-тайм, S-3, B-3);
        * `from <= slot.startsAt < to` (S-6);
        * слоты отсортированы по `startsAt` по возрастанию и не содержат дубликатов (S-7).

        Ограничения диапазона (S-5), нарушение любого из них дает `422`:

        * `to` строго позже `from`;
        * `to - from <= 31 дня`;
        * `from >= now - 1 день`;
        * `to <= now + 90 дней`.

        Операция безопасна и не имеет побочных эффектов: слоты не резервируются
        на время заполнения формы (S-9). Пустой список — валидный успешный ответ
        (US-G2 AC6). Пагинации нет: максимум 31 день × 48 слотов = 1488 элементов (S-8).
      responses:
        '200':
          description: Список свободных слотов (возможно пустой).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
              examples:
                withSlots:
                  summary: Три свободных слота
                  value:
                    calendarId: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    from: '2026-09-01T00:00:00Z'
                    to: '2026-09-08T00:00:00Z'
                    slotDurationMinutes: 30
                    generatedAt: '2026-09-01T07:12:44Z'
                    slots:
                      - startsAt: '2026-09-01T09:00:00Z'
                        endsAt: '2026-09-01T09:30:00Z'
                      - startsAt: '2026-09-01T09:30:00Z'
                        endsAt: '2026-09-01T10:00:00Z'
                      - startsAt: '2026-09-02T13:00:00Z'
                        endsAt: '2026-09-02T13:30:00Z'
                empty:
                  summary: Свободного времени в диапазоне нет
                  value:
                    calendarId: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    from: '2026-09-01T00:00:00Z'
                    to: '2026-09-08T00:00:00Z'
                    slotDurationMinutes: 30
                    generatedAt: '2026-09-01T07:12:44Z'
                    slots: []
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/CalendarNotFound'
        '422':
          description: Диапазон запроса нарушает правила S-4 или S-5.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rangeTooLong:
                  summary: Диапазон длиннее 31 дня
                  value:
                    code: VALIDATION_ERROR
                    message: Request range is invalid.
                    details:
                      - location: query
                        field: to
                        rule: S-5
                        message: Range between "from" and "to" must not exceed 31 days.
                    requestId: 1b1c1a4f-2c58-4a4b-9d3a-6e0a2a2f8d21
                    timestamp: '2026-09-01T07:12:44Z'
                notUtc:
                  summary: Смещение отличается от Z
                  value:
                    code: VALIDATION_ERROR
                    message: Request range is invalid.
                    details:
                      - location: query
                        field: from
                        rule: T-1
                        message: Timestamp must be RFC 3339 UTC with the "Z" suffix.
                    requestId: 3f0f7f21-9f0a-4a0b-8a7c-1f2b3c4d5e6f
                    timestamp: '2026-09-01T07:12:44Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /calendars/{slug}/bookings:
    parameters:
      - $ref: '#/components/parameters/CalendarSlug'
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Забронировать слот
      description: |
        Создает бронирование гостя на свободный 30-минутный слот.

        Клиент передает только `startsAt`; `endsAt` вычисляется сервером как
        `startsAt + 30 минут` (правило B-2). Слот должен быть кратен 30 минутам,
        полностью лежать внутри опубликованной доступности, быть свободным и
        удовлетворять лид-тайму 60 минут и горизонту 90 дней (B-1, B-3, B-4).

        ### Идемпотентность

        Необязательный заголовок `Idempotency-Key` (16–128 символов) делает создание
        повторяемым (правило B-7). Повтор с тем же ключом и тем же телом возвращает
        результат первой операции, включая management token (правило B-8), и заголовок
        `Idempotency-Replayed: true`. Повтор с тем же ключом и другим телом отвергается
        конфликтом `IDEMPOTENCY_KEY_REUSED`. Область действия ключа — календарь и данная
        операция, TTL записи идемпотентности — 24 часа.

        ### Management token

        Открытый management token возвращается **только** в ответе на создание
        (и в идемпотентном повторе). Отдельной операции «получить токен» не существует,
        восстановление невозможно (правила M-4, M-5). Клиент обязан поместить токен во
        fragment ссылки управления и передавать его далее только в заголовке
        `X-Booking-Token` (правила M-6, M-7).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            examples:
              minimal:
                summary: Минимальный запрос
                value:
                  startsAt: '2026-09-01T09:00:00Z'
                  guestName: Alex Guest
                  guestEmail: guest@example.com
              withComment:
                summary: С комментарием
                value:
                  startsAt: '2026-09-01T09:30:00Z'
                  guestName: Sam Visitor
                  guestEmail: sam.visitor@example.com
                  comment: Хочу обсудить миграцию на новый API.
      responses:
        '201':
          description: |
            Бронирование создано, либо возвращен сохраненный результат первой
            операции с тем же `Idempotency-Key` (см. заголовок `Idempotency-Replayed`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: Путь операции просмотра/отмены созданного бронирования.
              required: true
              schema:
                type: string
                examples:
                  - /api/v1/bookings/8b6b8a2a-4a3e-4a63-9d0f-2f1a5c4b7e10/cancellation
            Idempotency-Replayed:
              description: |
                `true`, если ответ воспроизведен по ранее использованному
                `Idempotency-Key` и новое бронирование не создавалось.
              required: false
              schema:
                type: boolean
                examples:
                  - false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
              examples:
                created:
                  summary: Бронирование подтверждено
                  value:
                    id: 8b6b8a2a-4a3e-4a63-9d0f-2f1a5c4b7e10
                    calendarId: 6f1c2f0e-9a1e-4d3b-9a4a-0f5b3f2a1c11
                    calendarSlug: demo
                    calendarTitle: Консультация 30 минут
                    startsAt: '2026-09-01T09:00:00Z'
                    endsAt: '2026-09-01T09:30:00Z'
                    durationMinutes: 30
                    status: CONFIRMED
                    createdAt: '2026-08-30T18:04:11Z'
                    managementToken: 6Qk9m2Xh1sT0pV7cRb4YwLdF3nJgZaEu8HrKtN5MvQo
                    managementPath: /bookings/8b6b8a2a-4a3e-4a63-9d0f-2f1a5c4b7e10
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/CalendarNotFound'
        '409':
          description: |
            Конфликт состояния: слот занят активным бронированием (`SLOT_TAKEN`,
            правило B-5) либо `Idempotency-Key` повторно использован с другим телом
            (`IDEMPOTENCY_KEY_REUSED`, правило B-7).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                slotTaken:
                  summary: Слот уже занят
                  value:
                    code: SLOT_TAKEN
                    message: The requested slot is no longer available.
                    details:
                      - location: body
                        field: startsAt
                        rule: B-5
                        message: An active booking already exists for this slot.
                    requestId: 9a4c2f18-6a2d-4d0e-8f6b-5c1d2e3f4a5b
                    timestamp: '2026-08-30T18:04:11Z'
                idempotencyKeyReused:
                  summary: Тот же ключ, другое тело
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: Idempotency-Key was already used with a different request body.
                    details:
                      - location: header
                        field: Idempotency-Key
                        rule: B-7
                        message: Use a new key for a new booking attempt.
                    requestId: 0d7c9b31-1e5a-4c7f-93a6-8b2c4d6e0f13
                    timestamp: '2026-08-30T18:04:11Z'
        '422':
          description: |
            Данные запроса не проходят валидацию: время вне сетки 30 минут, вне
            доступности, в прошлом, ближе лид-тайма, дальше горизонта, либо данные
            гостя нарушают ограничения B-6.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                guestFields:
                  summary: Некорректные данные гостя
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is invalid.
                    details:
                      - location: body
                        field: guestName
                        rule: B-6
                        message: Guest name must be 2 to 80 characters after trimming.
                      - location: body
                        field: guestEmail
                        rule: B-6
                        message: Guest email must be a syntactically valid address.
                    requestId: 4e2b6c80-7d3f-4a19-84c2-9f0a1b2c3d4e
                    timestamp: '2026-08-30T18:04:11Z'
                leadTime:
                  summary: До начала слота меньше лид-тайма
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is invalid.
                    details:
                      - location: body
                        field: startsAt
                        rule: B-3
                        message: Slot must start at least 60 minutes from now.
                    requestId: 7c3d9e21-5b4a-4f28-9c1d-2a3b4c5d6e7f
                    timestamp: '2026-08-30T18:04:11Z'
                outsideAvailability:
                  summary: Слот вне опубликованной доступности
                  value:
                    code: VALIDATION_ERROR
                    message: Request body is invalid.
                    details:
                      - location: body
                        field: startsAt
                        rule: B-1
                        message: Slot is not inside a published availability window.
                    requestId: 2f8a1c04-3d6b-4e57-a9c8-0b1d2e3f4a5c
                    timestamp: '2026-08-30T18:04:11Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /bookings/{bookingId}/cancellation:
    parameters:
      - $ref: '#/components/parameters/BookingId'
      - $ref: '#/components/parameters/BookingToken'
    get:
      tags: [Cancellation]
      operationId: getBookingCancellation
      summary: Просмотреть бронирование по management token
      description: |
        Возвращает минимальную карточку бронирования для страницы управления:
        время, длительность, статус, время отмены и признак возможности отмены
        (правило C-7).

        Персональные данные не возвращаются: имя, email и комментарий гостя
        отсутствуют в ответе намеренно, чтобы утечка ссылки была максимально
        бесполезной.

        Если токен отсутствует, неверен или относится к другому бронированию,
        возвращается `403 BOOKING_TOKEN_INVALID`. Тот же ответ возвращается для
        несуществующего бронирования: случаи неразличимы (правило M-11), поэтому
        `404` у этой операции не используется.
      responses:
        '200':
          description: Бронирование найдено, токен корректен.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancellationView'
              examples:
                confirmed:
                  summary: Подтвержденная будущая встреча
                  value:
                    id: 8b6b8a2a-4a3e-4a63-9d0f-2f1a5c4b7e10
                    calendarTitle: Консультация 30 минут
                    startsAt: '2026-09-01T09:00:00Z'
                    endsAt: '2026-09-01T09:30:00Z'
                    durationMinutes: 30
                    status: CONFIRMED
                    cancelledAt: null
                    rescheduledAt: null
                    cancellable: true
                cancelled:
                  summary: Встреча уже отменена
                  value:
                    id: 8b6b8a2a-4a3e-4a63-9d0f-2f1a5c4b7e10
                    calendarTitle: Консультация 30 минут
                    startsAt: '2026-09-01T09:00:00Z'
                    endsAt: '2026-09-01T09:30:00Z'
                    durationMinutes: 30
                    status: CANCELLED
                    cancelledAt: '2026-08-31T10:22:03Z'
                    rescheduledAt: null
                    cancellable: false
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '403':
          $ref: '#/components/responses/BookingTokenInvalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Cancellation]
      operationId: confirmBookingCancellation
      summary: Подтвердить отмену бронирования
      description: |
        Переводит бронирование в статус `CANCELLED`, фиксирует `cancelledAt`
        и немедленно освобождает слот (правила C-1, C-5).

        Операция идемпотентна: повторный запрос с корректным токеном возвращает
        то же тело с тем же `cancelledAt` и не порождает нового доменного события
        (правило C-2). Поэтому используется `200`, а не `204`: стабильный результат
        должен быть виден клиенту без дополнительного запроса.

        Отмена возможна только для встречи, начало которой строго в будущем
        (правило C-3); иначе возвращается `409 BOOKING_ALREADY_STARTED`, а состояние
        не меняется.

        Тело запроса не требуется: подтверждение выражается самим вызовом,
        причина отмены в MVP не собирается (правило C-6).
      responses:
        '200':
          description: Бронирование отменено либо уже было отменено ранее.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancellationView'
              examples:
                cancelled:
                  summary: Отмена выполнена
                  value:
                    id: 8b6b8a2a-4a3e-4a63-9d0f-2f1a5c4b7e10
                    calendarTitle: Консультация 30 минут
                    startsAt: '2026-09-01T09:00:00Z'
                    endsAt: '2026-09-01T09:30:00Z'
                    durationMinutes: 30
                    status: CANCELLED
                    cancelledAt: '2026-08-31T10:22:03Z'
                    rescheduledAt: null
