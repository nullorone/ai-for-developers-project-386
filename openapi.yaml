                        guestEmailMasked: g***@example.com
                        createdAt: '2026-08-30T18:04:11Z'
                        rescheduledAt: null
                      - id: 2c7d8e9f-0a1b-4c2d-8e3f-4a5b6c7d8e9f
                        startsAt: '2026-09-02T13:00:00Z'
                        endsAt: '2026-09-02T13:30:00Z'
